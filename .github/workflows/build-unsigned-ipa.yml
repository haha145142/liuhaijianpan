name: Build unsigned .ipa (dummy fallback)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  create-dummy-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create minimal dummy app and unsigned .ipa
        run: |
          set -euo pipefail
          BUILD_DIR="build"
          APP_NAME="DummyApp"
          APP_DIR="${BUILD_DIR}/${APP_NAME}.app"
          mkdir -p "$APP_DIR"
          cat > "$APP_DIR/Info.plist" <<'PL'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleIdentifier</key>
  <string>com.example.dummy</string>
  <key>CFBundleName</key>
  <string>DummyApp</string>
  <key>CFBundleExecutable</key>
  <string>dummy</string>
  <key>CFBundleVersion</key>
  <string>1</string>
  <key>CFBundleShortVersionString</key>
  <string>1.0</string>
  <key>CFBundlePackageType</key>
  <string>APPL</string>
</dict>
</plist>
PL
          echo '#!/bin/sh' > "$APP_DIR/dummy"
          echo 'echo "Hello from DummyApp"' >> "$APP_DIR/dummy"
          chmod +x "$APP_DIR/dummy"
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          ZIP_NAME="${APP_NAME}-unsigned.zip"
          zip -r "$ZIP_NAME" Payload
          mv "$ZIP_NAME" "${APP_NAME}-unsigned.ipa"
          rm -rf Payload
          ls -lh "${APP_NAME}-unsigned.ipa"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: unsigned.ipa
          path: "DummyApp-unsigned.ipa"
