name: Build unsigned .ipa (explicit project)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  CONFIGURATION: Release
  BUILD_DIR: build
  SCHEME: JevJarvis
  PROJECT_PATH: App/JevJarvis.xcodeproj

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnostics - environment and repo layout
        run: |
          set -euo pipefail
          swift --version || true
          xcodebuild -version || true
          echo "PWD: $(pwd)"
          echo "Listing files (top level)"
          ls -la
          echo "Listing App directory"
          ls -la App || true
          echo "Project path: $PROJECT_PATH"

      - name: xcodebuild -list
        run: |
          set -euo pipefail
          echo "Running xcodebuild -list for project"
          xcodebuild -project "$PROJECT_PATH" -list || true

      - name: Archive (without code signing)
        run: |
          set -o pipefail
          echo "Archiving project: $PROJECT_PATH, scheme: $SCHEME"
          xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration "$CONFIGURATION" -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO BUILD_DIR="$BUILD_DIR" archive -archivePath "$BUILD_DIR/$SCHEME.xcarchive" | tee xcodebuild.log
          echo "xcodebuild exit status: $?"
          tail -n 200 xcodebuild.log || true

      - name: Create unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find "$BUILD_DIR" -name "*.app" | head -n1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "App not found in $BUILD_DIR"
            ls -R "$BUILD_DIR" || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ZIP_NAME="$SCHEME-unsigned.zip"
          zip -r "$ZIP_NAME" Payload
          mv "$ZIP_NAME" "$SCHEME-unsigned.ipa"
          rm -rf Payload
          ls -lh "$SCHEME-unsigned.ipa"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.SCHEME }}-unsigned.ipa"
          path: "${{ env.SCHEME }}-unsigned.ipa"
