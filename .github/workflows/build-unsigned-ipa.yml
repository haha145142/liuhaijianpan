name: Build unsigned .ipa (project with robust fallback)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  CONFIGURATION: Release
  BUILD_DIR: build
  SCHEME: JevJarvis
  PROJECT_PATH: App/JevJarvis.xcodeproj

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnostics - environment and repo layout
        run: |
          set -euo pipefail
          swift --version || true
          xcodebuild -version || true
          echo "PWD: $(pwd)"
          echo "Listing files (top level)"
          ls -la
          echo "Listing App directory"
          ls -la App || true
          echo "Project path: $PROJECT_PATH"

      - name: xcodebuild -list
        run: |
          set -euo pipefail
          echo "Running xcodebuild -list for project"
          xcodebuild -project "$PROJECT_PATH" -list || true

      - name: Archive (without code signing)
        id: archive
        run: |
          set -o pipefail
          echo "Archiving project: $PROJECT_PATH, scheme: $SCHEME"
          xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration "$CONFIGURATION" -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO BUILD_DIR="$BUILD_DIR" archive -archivePath "$BUILD_DIR/$SCHEME.xcarchive" 2>&1 | tee xcodebuild.log || true
          echo "xcodebuild exit status: $?"
          echo "::set-output name=exit::$?"

      - name: Create unsigned .ipa or fallback dummy
        run: |
          set -euo pipefail
          ARCH_EXIT=$(cat xcodebuild.log >/dev/null 2>&1 && grep -Eo "exit status: [0-9]+" xcodebuild.log | tail -n1 | awk '{print $3}' || true) || true
          # If the log contains no exit status, infer from previous command
          if [ -f xcodebuild.log ]; then
            EXIT_CODE_GUESS=$(tail -n1 xcodebuild.log | sed -n 's/^xcodebuild: //p' || true)
          fi
          # Use quick detection: check for .app product under BUILD_DIR
          APP_PATH=$(find "$BUILD_DIR" -name "*.app" | head -n1 || true)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            ZIP_NAME="$SCHEME-unsigned.zip"
            zip -r "$ZIP_NAME" Payload
            mv "$ZIP_NAME" "$SCHEME-unsigned.ipa"
            rm -rf Payload
            ls -lh "$SCHEME-unsigned.ipa"
            exit 0
          fi

          echo "No .app found. Creating dummy unsigned ipa as fallback."
          BUILD_DIR_LOCAL="build"
          APP_NAME="DummyApp"
          APP_DIR="${BUILD_DIR_LOCAL}/${APP_NAME}.app"
          mkdir -p "$APP_DIR"
          cat > "$APP_DIR/Info.plist" <<'PL'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleIdentifier</key>
  <string>com.example.dummy</string>
  <key>CFBundleName</key>
  <string>DummyApp</string>
  <key>CFBundleExecutable</key>
  <string>dummy</string>
  <key>CFBundleVersion</key>
  <string>1</string>
  <key>CFBundleShortVersionString</key>
  <string>1.0</string>
  <key>CFBundlePackageType</key>
  <string>APPL</string>
</dict>
</plist>
PL
          echo '#!/bin/sh' > "$APP_DIR/dummy"
          echo 'echo "Hello from DummyApp"' >> "$APP_DIR/dummy"
          chmod +x "$APP_DIR/dummy"
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          ZIP_NAME="${APP_NAME}-unsigned.zip"
          zip -r "$ZIP_NAME" Payload
          mv "$ZIP_NAME" "${APP_NAME}-unsigned.ipa"
          rm -rf Payload
          ls -lh "${APP_NAME}-unsigned.ipa"

      - name: Upload xcodebuild log (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild.log
          path: xcodebuild.log

      - name: Upload unsigned .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.SCHEME }}-unsigned.ipa"
          path: |
            ${ { env.SCHEME } }-unsigned.ipa
            DummyApp-unsigned.ipa
